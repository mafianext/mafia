<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мафия — игра для ведущего</title>
<meta name="description" content="Party game Mafia: deal roles, run nights and votes, read the story aloud. Works offline on one phone.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Yeseva+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root {
  --display: "Yeseva One", "Georgia", "Times New Roman", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }

/* Day: a pale washed sky, brick red for blood and decisions */
body[data-theme="day"] {
  color-scheme: light;
  --bg: #E3EBEE; --surface: #F6F9FA; --ink: #1B2630; --muted: #586973;
  --line: #C3D0D7; --accent: #A3322A; --on-accent: #FFF6F2; --soft: #D5E0E5;
  --good: #2F6B4F;
}
@media (prefers-color-scheme: dark) {
  body[data-theme="day"] {
    color-scheme: dark;
    --bg: #1D252B; --surface: #263038; --ink: #E5ECEF; --muted: #97A6AF;
    --line: #394651; --accent: #E06A5D; --on-accent: #1D1312; --soft: #2E3942;
    --good: #7FC4A0;
  }
}
/* Night: deep indigo, moonlight gold */
body[data-theme="night"] {
  color-scheme: dark;
  --bg: #131934; --surface: #1D2547; --ink: #ECE8DB; --muted: #9AA1C0;
  --line: #333D68; --accent: #F0C35A; --on-accent: #1A1830; --soft: #262F57;
  --good: #8FD3AE;
}

html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.5 var(--body);
  transition: background-color .7s ease, color .7s ease;
}
@media (prefers-reduced-motion: reduce) { body, * { transition: none !important; animation: none !important; } }

.wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 132px; }
h1, h2, h3 { font-weight: 400; margin: 0; }
h2 { font: 400 24px/1.2 var(--display); margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.top .back { margin-left: -8px; }
.brand { font: 400 clamp(52px, 16vw, 76px)/1 var(--display); letter-spacing: -.01em; margin: 18px 0 6px; }
.tagline { color: var(--muted); max-width: 32ch; }

/* phase headline: the one loud thing */
.phase { margin: 14px 0 18px; }
.phase .glyph { font-size: 40px; line-height: 1; display: block; margin-bottom: 6px; }
.phase h1 { font: 400 clamp(44px, 13vw, 64px)/1 var(--display); }
.phase .sub { color: var(--muted); margin-top: 8px; }

/* buttons */
button { font: inherit; color: inherit; }
.btn {
  appearance: none; border: 1.5px solid var(--line); background: transparent;
  border-radius: 12px; padding: 11px 16px; min-height: 46px; cursor: pointer;
  font-weight: 500; text-align: center;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { display: block; width: 100%; }
.btn.quiet { border-color: transparent; color: var(--muted); padding-left: 8px; padding-right: 8px; }
.btn.danger { color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.stack > * + * { margin-top: 10px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 18px 18px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 38%);
}
.dock .inner { max-width: 560px; margin: 0 auto; }
.dock .btn.primary { width: 100%; min-height: 54px; font-size: 18px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.list > li { border-bottom: 1px solid var(--line); }
.list .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-height: 52px; }
.list button.item { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 12px 2px; }
.list button.item:hover { background: var(--soft); }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; text-align: right; }
.dead { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

/* roster */
.tick {
  width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1.5px solid var(--line);
  background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 16px;
}
.tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.nick {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: 500 17px/1.3 var(--body); padding: 8px 4px; border-radius: 6px;
}
.nick:focus { background: var(--soft); outline: none; }
.mini { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.add { display: flex; gap: 10px; margin-top: 12px; }
.add input {
  flex: 1 1 auto; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font: inherit;
}

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 9px 16px; min-height: 44px; cursor: pointer; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* night lines */
.act .who { font-weight: 600; }
.act .target { color: var(--muted); }
.act .flag { font-size: 14px; color: var(--accent); display: block; margin-top: 2px; }
.preview b { color: var(--accent); font-weight: 600; }

/* role cards */
.counter { display: flex; align-items: center; gap: 6px; }
.counter .val { min-width: 48px; text-align: center; font-weight: 600; }
details.desc summary { cursor: pointer; list-style: none; }
details.desc summary::-webkit-details-marker { display: none; }
details.desc p { color: var(--muted); font-size: 15px; margin: 2px 0 12px 34px; }

/* story */
.story p { font-size: 19px; line-height: 1.6; max-width: 34em; }
.story p:first-child { font-family: var(--display); font-size: 24px; line-height: 1.3; }
.hostnotes { margin-top: 22px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 12px 12px 0; }
.hostnotes ul { margin: 6px 0 0; padding-left: 18px; }

/* secret card */
.card {
  margin-top: 8px; padding: 28px 22px; border-radius: 22px; background: var(--surface);
  border: 1px solid var(--line); animation: rise .35s ease-out;
}
.card .emoji { font-size: 64px; line-height: 1; }
.card h1 { font: 400 clamp(38px, 11vw, 52px)/1.05 var(--display); margin: 14px 0 12px; }
.card .team { color: var(--muted); margin-bottom: 14px; }
.card .extra { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

.pass { text-align: center; padding: 40px 0 10px; }
.pass .big { font: 400 clamp(36px, 11vw, 52px)/1.1 var(--display); margin: 10px 0 18px; overflow-wrap: anywhere; }

/* votes */
.vote select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 8px 10px; max-width: 52%;
}
.bar { height: 6px; border-radius: 3px; background: var(--accent); margin-top: 6px; }
.tally { font-weight: 600; font-variant-numeric: tabular-nums; }

/* dice */
.die {
  width: 120px; height: 120px; margin: 18px auto; border-radius: 22px; background: var(--surface);
  border: 2px solid var(--line); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 16px;
}
.die span { width: 20px; height: 20px; border-radius: 50%; place-self: center; }
.die span.on { background: var(--ink); }
.facemap { list-style: none; padding: 0; margin: 0; }
.facemap li { padding: 6px 0; border-bottom: 1px solid var(--line); }

.rps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.rps button { font-size: 46px; min-height: 100px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }

.banner { padding: 12px 14px; border-radius: 12px; background: var(--soft); margin: 12px 0; }
.win h1 { font: 400 clamp(42px, 12vw, 60px)/1.05 var(--display); margin: 14px 0 10px; }

.tools { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 10;
  max-width: calc(100% - 36px); font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.pts { font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>

// ---------------- state ----------------
const KEY = "mafia-web-v1";
function prefDefaults() {
  const p = { preset: "classic", counts: { ...PRESETS.classic }, custom: { ...PRESETS.classic } };
  for (const [k, v] of Object.entries(SETTINGS_SPEC)) p[k] = v[0];
  return p;
}
function defaultState() {
  const ru = (navigator.language || "").toLowerCase().startsWith("ru");
  return { lang: ru ? "ru" : "en", roster: [], lobby: [], prefs: prefDefaults(), stats: {}, game: null,
    view: "home", arg: null, ret: null, nextId: 1 };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaultState(); } catch (e) { S = defaultState(); }
S.prefs = Object.assign(prefDefaults(), S.prefs || {});
if (S.view === "card" || S.view === "rps_pick") S.view = "game";   // never reopen a secret screen after reload
if (!S.game && !["home", "roles", "settings", "board", "history"].includes(S.view)) S.view = "home";

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage full or blocked */ } }
const G = () => S.game;

// ---------------- helpers ----------------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function t(key, kw) {
  let s = T[S.lang][key] ?? T.ru[key] ?? key;
  if (kw) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in kw ? kw[k] : m));
  return s;
}
const GENDER_RE = /\[([^\[\]|]*)\|([^\[\]]*)\]/g;
const gfmt = (text, gender) => text.replace(GENDER_RE, (m, a, b) => (gender === "f" ? b : a));
function roleName(role, gender, emoji = true) {
  const [m, f] = ROLE_NAMES[S.lang][role];
  const name = gender === "f" ? f : m;
  return emoji ? `${ROLE_EMOJI[role]} ${name}` : name;
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = n => Math.floor(Math.random() * n);
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
const rosterById = id => S.roster.find(p => p.id === id);
function stats(id) { return S.stats[id] || (S.stats[id] = { points: 0, last: 0, games: [] }); }

// ---------------- game state helpers (ports of mafia_bot.py) ----------------
const P = id => G().players[id];
const nm = id => (id && G().players[id] ? esc(G().players[id].nick) : "?");
const cfg = () => (G() && G().cfg) || S.prefs;
const inGame = () => G() && ["night", "day"].includes(G().phase);
const alive = () => G().order.filter(u => P(u).alive);
const isAlive = u => !!(u && G().players[u] && P(u).alive);
const roleOf = u => P(u).role;
function teamOf(u) { const r = roleOf(u); return MAFIA_TEAM.has(r) || (r === "turncoat" && G().turned) ? "mafia" : "town"; }
function inCircle(u) { const r = roleOf(u); return r === "mafia" || r === "framer" || (r === "turncoat" && G().turned); }
const killers = () => alive().filter(u => roleOf(u) === "mafia" || (roleOf(u) === "turncoat" && G().turned));
const nightActors = () => NIGHT_ROLES.flatMap(r => alive().filter(u => roleOf(u) === r && !(r === "lawyer" && G().lawyer_found.includes(u))));
function checkWinner() {
  const a = alive(); const m = a.filter(u => teamOf(u) === "mafia").length;
  if (m === 0) return "town";
  if (m >= a.length - m) return "mafia";
  return null;
}
const addPoints = (u, key) => { G().points[u] = (G().points[u] || 0) + POINTS[key]; };

function mafiaCount(n) { const m = cfg().counts.mafia || 0; return m > 0 ? m : Math.max(1, Math.floor(n / 4)); }

function planRoles(n) {
  const counts = cfg().counts; const c = {};
  ROLE_ORDER.forEach(r => (c[r] = counts[r] || 0));
  c.mafia = mafiaCount(n);
  const dropped = [];
  const slots = r => SLOTS[r] || 1;
  const total = () => ROLE_ORDER.reduce((s, r) => s + c[r] * slots(r), 0);
  const mteam = () => ROLE_ORDER.reduce((s, r) => s + (MAFIA_TEAM.has(r) ? c[r] : 0), 0);
  const unDrop = r => dropped.splice(dropped.indexOf(r), 1);
  for (const r of [...TRIM_ORDER, "doctor", "detective"]) {
    const floor = r === "doctor" || r === "detective" ? 1 : 0;
    while (total() > n && c[r] > floor) { c[r]--; dropped.push(r); }
  }
  while (total() > n && c.mafia > 1) { c.mafia--; dropped.push("mafia"); }
  for (const r of [...dropped].reverse()) if (total() + slots(r) <= n) { c[r]++; unDrop(r); }
  while (mteam() >= n - mteam()) {
    let done = false;
    for (const r of ["lawyer", "framer", "mafia"]) {
      if (c[r] > (r === "mafia" ? 1 : 0)) { c[r]--; dropped.push(r); done = true; break; }
    }
    if (!done) break;
  }
  for (const r of [...dropped].reverse()) if (!MAFIA_TEAM.has(r) && total() + slots(r) <= n) { c[r]++; unDrop(r); }
  const roles = [];
  ROLE_ORDER.forEach(r => { for (let i = 0; i < c[r] * slots(r); i++) roles.push(r); });
  while (roles.length < n) roles.push("civilian");
  return [roles.slice(0, n), dropped];
}
function rolesLine(roles) {
  const cnt = {}; roles.forEach(r => (cnt[r] = (cnt[r] || 0) + 1));
  return [...ROLE_ORDER, "civilian"].filter(r => cnt[r]).map(r => `${ROLE_EMOJI[r]}×${cnt[r]}`).join("  ");
}
function uniqDropped(list) {
  const cnt = {}; list.forEach(r => (cnt[r] = (cnt[r] || 0) + 1));
  return Object.entries(cnt).map(([r, n]) => roleName(r, null, false) + (n > 1 ? ` ×${n}` : "")).join(", ");
}

// ---------------- night resolution (same order as the bot) ----------------
function resolve() {
  const g = G(), n = g.night;
  const blocked = new Set(alive().filter(u => roleOf(u) === "partyhost" && n[u]).map(u => n[u]));
  const redirect = {};
  for (const u of alive()) {
    if (roleOf(u) === "driver" && !blocked.has(u)) {
      const pair = n[u] || [];
      if (pair.length === 2 && pair[0] !== pair[1]) { redirect[pair[0]] = pair[1]; redirect[pair[1]] = pair[0]; }
    }
  }
  const target = u => (blocked.has(u) || !n[u] || roleOf(u) === "driver" ? null : (redirect[n[u]] || n[u]));
  const out = { blocked, deaths: [], events: [], notes: [], checks: {}, lawyer: {}, points: [], lucky_used: [] };

  for (const u of alive()) if (roleOf(u) === "partyhost" && n[u] && teamOf(n[u]) === "mafia") out.points.push([u, "block"]);

  const framed = new Set(alive().filter(u => roleOf(u) === "framer" && target(u)).map(target));
  const healed = {}, guards = {};
  for (const u of alive()) {
    const tg = target(u);
    if (tg && roleOf(u) === "doctor") (healed[tg] = healed[tg] || []).push(u);
    if (tg && roleOf(u) === "bodyguard") guards[tg] = u;
  }

  const kill = n.mafia, team = killers();
  if (kill && team.length) {
    if (team.some(k => blocked.has(k))) {
      out.events.push({ k: "quiet" }); out.notes.push(["note_kill_blocked", {}]);
    } else {
      const victim = redirect[kill] || kill;
      if (!isAlive(victim)) out.events.push({ k: "quiet" });
      else if (roleOf(victim) === "immortal") { out.events.push({ k: "survived" }); out.notes.push(["note_immortal", { v: victim }]); }
      else if (healed[victim]) {
        out.events.push({ k: "saved" }); out.notes.push(["note_saved", { v: victim }]);
        healed[victim].forEach(d => out.points.push([d, "save"]));
      } else if (guards[victim]) {
        const bg = guards[victim];
        out.deaths.push(bg); out.events.push({ k: "bodyguard", v: bg, reveal: true });
        out.notes.push(["note_guarded", { v: victim, b: bg }]); out.points.push([bg, "guard"]);
      } else if (roleOf(victim) === "lucky" && !g.lucky_used.includes(victim)) {
        out.lucky_used.push(victim); out.events.push({ k: "survived" }); out.notes.push(["note_lucky", { v: victim }]);
      } else {
        out.deaths.push(victim); out.events.push({ k: "kill", v: victim, reveal: true });
        team.forEach(k => out.points.push([k, "kill"]));
      }
      if (victim !== kill) out.notes.push(["note_redirected", { v: kill, b: victim }]);
    }
  } else out.events.push({ k: "quiet" });

  for (const u of alive()) {
    if (roleOf(u) === "detective" && target(u)) {
      const tg = target(u);
      const really = teamOf(tg) === "mafia" && roleOf(tg) !== "lawyer";
      out.checks[u] = [tg, really || framed.has(tg)];
      if (really) out.points.push([u, "check"]);
      else if (framed.has(tg)) alive().filter(f => roleOf(f) === "framer" && target(f) === tg).forEach(f => out.points.push([f, "frame"]));
    }
  }
  for (const u of alive()) {
    if (roleOf(u) === "lawyer" && !g.lawyer_found.includes(u) && target(u)) {
      const tg = target(u), ok = inCircle(tg);
      out.lawyer[u] = [tg, ok];
      if (ok) out.points.push([u, "lawyer"]);
    }
  }
  return out;
}

// ---------------- game flow ----------------
function newGame(ids) {
  return {
    phase: "reveal", players: {}, order: [], round: 0, night: {}, last_heal: {}, votes: {}, vote_stage: null,
    tie_log: [], rps: null, dice: null, decided: null, events: [], notes: [], storyKind: null, turnPending: [],
    points: {}, turned: false, mayor_used: false, lawyer_found: [], lucky_used: [], seen: [],
    started_at: new Date().toISOString(), winner: null, cfg: JSON.parse(JSON.stringify(S.prefs)), dropped: [], ids,
  };
}
function deal(ids) {
  ids = ids.filter(id => rosterById(id));
  if (ids.length < 3) { toast(t("need_3")); return; }
  S.game = newGame(ids);
  const g = G();
  ids.forEach(id => { const r = rosterById(id); g.players[id] = { nick: r.nick, gender: r.gender, role: null, alive: true }; g.order.push(id); });
  const [roles, dropped] = planRoles(ids.length);
  shuffle(roles);
  g.order.forEach((u, i) => (g.players[u].role = roles[i]));
  g.dropped = dropped;
  go("game");
}
function startPlay() {
  const g = G();
  if (g.cfg.first_phase === "night") Object.assign(g, { phase: "night", round: 1 });
  else Object.assign(g, { phase: "day", round: 0 });
  go("game");
}
function turncoatCheck(notes) {
  const g = G();
  if (g.turned) return;
  if (!g.order.some(u => roleOf(u) === "mafia" && !P(u).alive)) return;
  const tcs = alive().filter(u => roleOf(u) === "turncoat");
  if (!tcs.length) return;
  g.turned = true;
  tcs.forEach(tc => { notes.push(["note_turned", { v: tc }]); g.turnPending.push(tc); });
}
function applyNight() {
  const g = G(), out = resolve();
  out.deaths.forEach(d => (P(d).alive = false));
  g.lucky_used.push(...out.lucky_used);
  for (const u of alive()) if (roleOf(u) === "doctor") { if (g.night[u]) g.last_heal[u] = g.night[u]; else delete g.last_heal[u]; }
  for (const [u, [, ok]] of Object.entries(out.lawyer)) if (ok) g.lawyer_found.push(u);
  out.points.forEach(([u, k]) => addPoints(u, k));
  const notes = out.notes;
  for (const [u, [tg, m]] of Object.entries(out.checks)) notes.push([m ? "note_check_mafia" : "note_check_town", { d: u, v: tg }]);
  for (const [u, [tg, ok]] of Object.entries(out.lawyer)) notes.push([ok ? "note_lawyer_ok" : "note_lawyer_no", { d: u, v: tg }]);
  turncoatCheck(notes);
  const events = [{ k: "night_header", r: g.round }, ...out.events];
  Object.assign(g, { phase: "day", night: {}, votes: {}, vote_stage: null, storyKind: "morning" });
  finishStory(events, notes);
}
const tally = () => {
  const c = {};
  for (const [v, cand] of Object.entries(G().votes)) if (isAlive(v) && isAlive(cand)) c[cand] = (c[cand] || 0) + 1;
  return c;
};
function leaders() {
  const c = tally(), vals = Object.values(c);
  if (!vals.length) return [];
  const top = Math.max(...vals);
  return Object.keys(c).filter(k => c[k] === top);
}
const mayorAvailable = () => !G().mayor_used && alive().some(u => roleOf(u) === "mayor");
function finalizeDay(target, mayor = false) {
  const g = G();
  for (const [voter, cand] of Object.entries(g.votes)) {
    if (isAlive(voter) && G().players[cand] && teamOf(voter) === "town" && teamOf(cand) === "mafia") addPoints(voter, "vote");
  }
  const events = [{ k: "day_header", r: g.round }, ...g.tie_log];
  const notes = [];
  if (mayor && target) { g.mayor_used = true; events.push({ k: "mayor", v: target }); notes.push(["note_mayor", { v: target }]); }
  else if (target && isAlive(target)) {
    P(target).alive = false; events.push({ k: "exile", v: target, reveal: true }); turncoatCheck(notes);
  } else events.push({ k: "no_exile" });
  g.round += 1;
  Object.assign(g, { phase: "night", night: {}, votes: {}, vote_stage: null, tie_log: [], rps: null, dice: null, decided: null, storyKind: "evening" });
  finishStory(events, notes);
}
function finishStory(events, notes) {
  const g = G(), w = checkWinner();
  if (w) { events.push({ k: "win_" + w }); endGame(w); }
  events.forEach(e => { if (e.i === undefined) e.i = rand(1000); });
  g.events = events; g.notes = notes;
  go("story");
}
function endGame(winner) {
  const g = G();
  g.phase = "over"; g.winner = winner;
  for (const u of g.order) {
    const p = P(u), won = teamOf(u) === winner;
    if (won) addPoints(u, "win");
    if (p.alive) addPoints(u, "survive");
    if (rosterById(u)) {
      const st = stats(u), pts = g.points[u] || 0;
      st.points += pts; st.last = pts;
      st.games.unshift({ date: new Date().toISOString(), role: p.role, team: teamOf(u), won, survived: p.alive, pts });
      st.games = st.games.slice(0, 60);
    }
  }
}
function rpsResolve() {
  const g = G(), rps = g.rps, ch = rps.choices;
  const line = rps.duel.map(u => `${nm(u)} ${RPS_EMOJI[ch[u]]}`).join(" · ");
  const symbols = [...new Set(Object.values(ch))];
  if (symbols.length !== 2) { rps.log.push(line + " — 🔁"); rps.round++; rps.choices = {}; return; }
  const [a, b] = symbols, win = RPS_BEATS[a] === b ? a : b;
  const losers = rps.duel.filter(u => ch[u] !== win);
  rps.log.push(line);
  rps.duel = losers; rps.choices = {};
  if (losers.length === 1) {
    g.tie_log.push({ k: "tie_rps", v: losers[0], x: rps.log.join("\n") });
    g.decided = losers[0]; g.vote_stage = "decided";
  } else rps.round++;
}
function diceSetup() {
  const g = G(), cands = leaders(), n = cands.length;
  if (n > 6) {
    const chosen = cands[rand(n)];
    g.tie_log.push({ k: "tie_random", v: chosen }); g.decided = chosen; g.vote_stage = "decided"; return;
  }
  const allowed = 6 - (6 % n);
  g.dice = { cands, allowed, value: null, miss: null };
  g.vote_stage = "dice";
}
function diceMapping() {
  const d = G().dice, n = d.cands.length;
  return d.cands.map((c, i) => {
    const faces = []; for (let v = 1; v <= d.allowed; v++) if ((v - 1) % n === i) faces.push(v);
    return `${faces.join(", ")} → ${nm(c)}`;
  });
}

function theme() {

function render() {

// ---------------- actions ----------------
function addPlayer() {
  const inp = document.getElementById("newNick");
  const nick = (inp.value || "").trim().replace(/\s+/g, " ");
  if (nick.length < 2 || nick.length > 20) { toast(t("nick_bad")); inp.focus(); return; }
  if (S.roster.some(p => p.nick.toLowerCase() === nick.toLowerCase())) { toast(t("nick_taken")); inp.focus(); return; }
  const id = "p" + S.nextId++;
  S.roster.push({ id, nick, gender: null });
  S.lobby.push(id);
  save(); render();
  document.getElementById("newNick").focus();
}
const ACT = {
  go(arg) {
    if (arg.startsWith("history:")) return go("history", arg.slice(8));
    if (arg.startsWith("pick:")) return go("pick", arg.slice(5));
    if (arg.startsWith("rps_pick:")) return go("rps_pick", arg.slice(9));
    go(arg);
  },
  lang() { S.lang = S.lang === "ru" ? "en" : "ru"; save(); render(); },
  addPlayer,
  toggleIn(id) { S.lobby = S.lobby.includes(id) ? S.lobby.filter(x => x !== id) : [...S.lobby, id]; save(); render(); },
  gender(id) { const p = rosterById(id); p.gender = p.gender === null ? "m" : p.gender === "m" ? "f" : null; save(); render(); },
  delPlayer(id) { S.roster = S.roster.filter(p => p.id !== id); S.lobby = S.lobby.filter(x => x !== id); save(); render(); },
  deal() { deal(S.roster.filter(p => S.lobby.includes(p.id)).map(p => p.id)); },
  preset(k) { S.prefs.counts = { ...(k === "custom" ? S.prefs.custom : PRESETS[k]) }; S.prefs.preset = k; save(); render(); },
  rc(arg) {
    const [role, op] = arg.split(":"), c = S.prefs.counts;
    if (op === "auto") c.mafia = 0;
    else {
      let cur = c[role] || 0;
      if (role === "mafia" && cur === 0) cur = mafiaCount(Math.max(S.lobby.filter(id => rosterById(id)).length, 3));
      const low = role === "mafia" ? 1 : 0;
      c[role] = Math.max(low, Math.min(MAX_COUNT[role] || 1, cur + (op === "+" ? 1 : -1)));
    }
    S.prefs.preset = "custom"; S.prefs.custom = { ...c }; save(); render();
  },
  setting(k) { const o = SETTINGS_SPEC[k]; S.prefs[k] = o[(o.indexOf(S.prefs[k]) + 1) % o.length]; save(); render(); },
  clearStats() { if (confirm(t("clear_confirm"))) { S.stats = {}; save(); render(); } },
  pass(u) { S.ret = S.view === "story" ? "story" : "game"; go("pass", u); },
  showCard(u) { go("card", u); },
  hideCard(u) {
    const g = G();
    if (!g.seen.includes(u)) g.seen.push(u);
    g.turnPending = g.turnPending.filter(x => x !== u);
    go(S.ret || "game");
  },
  startPlay,
  startNight() { Object.assign(G(), { phase: "night", round: 1, night: {} }); go("game"); },
  pickTarget(arg) {
    const [actor, target] = arg.split("|"), g = G();
    if (actor !== "mafia" && !nightActors().includes(actor)) return go("game");
    if (actor !== "mafia" && roleOf(actor) === "driver") {
      let pair = [...(g.night[actor] || [])];
      if (!target) pair = [];
      else if (pair.includes(target)) pair = pair.filter(x => x !== target);
      else if (pair.length < 2) pair.push(target);
      else pair = [target];
      g.night[actor] = pair;
      return pair.length === 2 || !target ? go("game") : (save(), render());
    }
    if (target) g.night[actor] = target; else delete g.night[actor];
    go("game");
  },
  endNight() { applyNight(); },
  storyNext() { G().turnPending = []; go("game"); },
  openVote() { Object.assign(G(), { votes: {}, vote_stage: "open" }); go("game"); },
  closeVote() { G().vote_stage = "result"; go("game"); },
  revote() { const g = G(); g.tie_log.push({ k: "tie_revote" }); Object.assign(g, { votes: {}, vote_stage: "open", rps: null, dice: null, decided: null }); go("game"); },
  exile(cand) { finalizeDay(cand || null); },
  mayor(cand) { if (mayorAvailable()) finalizeDay(cand, true); },
  rps() { if (leaders().length > 1) { Object.assign(G(), { rps: { duel: leaders(), choices: {}, round: 1, log: [] }, vote_stage: "rps" }); } go("game"); },
  rpsChoose(arg) {
    const [u, c] = arg.split("|"), rps = G().rps;
    if (!rps || !rps.duel.includes(u)) return go("game");
    rps.choices[u] = c;
    if (rps.duel.every(x => rps.choices[x])) rpsResolve();
    go("game");
  },
  rpsRandom() { const rps = G().rps; rps.duel.forEach(u => { if (!rps.choices[u]) rps.choices[u] = "rps"[rand(3)]; }); rpsResolve(); go("game"); },
  rpsCancel() { Object.assign(G(), { rps: null, vote_stage: "result" }); go("game"); },
  dice() { if (leaders().length > 1) diceSetup(); go("game"); },
  rollDice() {
    const g = G(), d = g.dice;
    const finish = () => {
      const value = 1 + rand(6);
      if (value > d.allowed) { d.miss = value; save(); render(); return; }
      d.value = value; d.miss = null;
      const chosen = d.cands[(value - 1) % d.cands.length];
      g.tie_log.push({ k: "tie_dice", v: chosen, x: `🎲 ${value}\n${diceMapping().join("\n")}` });
      g.decided = chosen; g.vote_stage = "decided";
      save(); render();
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
    const btn = document.querySelector(".dock .btn"); if (btn) btn.disabled = true;
    let k = 0;
    const spin = setInterval(() => {
      const el = document.getElementById("die");
      if (el) el.outerHTML = dieFace(1 + rand(6));
      if (++k >= 10) { clearInterval(spin); finish(); }
    }, 90);
  },
  rematch() { const ids = G().ids || G().order; S.lobby = ids.filter(id => rosterById(id)); S.game = null; deal(S.lobby); },
  toLobby() { S.game = null; go("home"); },
  abort() { const ids = G().order; S.game = null; S.lobby = ids.filter(id => rosterById(id)); go("home"); },
};
const CHANGE = {
  rename(id, el) {
    const p = rosterById(id), nick = el.value.trim().replace(/\s+/g, " ");
    if (nick.length < 2 || nick.length > 20) { toast(t("nick_bad")); el.value = p.nick; return; }
    if (S.roster.some(x => x.id !== id && x.nick.toLowerCase() === nick.toLowerCase())) { toast(t("nick_taken")); el.value = p.nick; return; }
    p.nick = nick; save(); render();
  },
  vote(voter, el) { const g = G(); if (el.value) g.votes[voter] = el.value; else delete g.votes[voter]; save(); render(); },
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg || "", el); }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el.dataset.arg, el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "newNick") { e.preventDefault(); addPlayer(); }
  if (e.key === "Enter" && e.target.classList.contains("nick")) e.target.blur();
});

render();
</script>
</body>
