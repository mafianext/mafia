<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мафия</title>
<meta name="description" content="Мафия по сети: тайные роли, ночные ходы и голосование — каждый играет со своего компьютера или телефона.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Yeseva+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root {
  --display: "Yeseva One", Georgia, "Times New Roman", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
body[data-theme="day"] {
  color-scheme: light;
  --bg: #E3EBEE; --surface: #F6F9FA; --ink: #1B2630; --muted: #586973;
  --line: #C3D0D7; --accent: #A3322A; --on-accent: #FFF6F2; --soft: #D5E0E5;
}
@media (prefers-color-scheme: dark) {
  body[data-theme="day"] {
    color-scheme: dark;
    --bg: #1D252B; --surface: #263038; --ink: #E5ECEF; --muted: #97A6AF;
    --line: #394651; --accent: #E06A5D; --on-accent: #1D1312; --soft: #2E3942;
  }
}
body[data-theme="night"] {
  color-scheme: dark;
  --bg: #131934; --surface: #1D2547; --ink: #ECE8DB; --muted: #9AA1C0;
  --line: #333D68; --accent: #F0C35A; --on-accent: #1A1830; --soft: #262F57;
}
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--body);
  transition: background-color .7s ease, color .7s ease; }
@media (prefers-reduced-motion: reduce) { *, body { transition: none !important; animation: none !important; } }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 18px 132px; }
h1, h2, h3 { font-weight: 400; margin: 0; }
h2 { font: 400 24px/1.2 var(--display); margin: 26px 0 10px; }
h2 .note { font: 400 15px var(--body); color: var(--muted); }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.top .row { flex-wrap: nowrap; }
.brand { font: 400 clamp(52px, 16vw, 76px)/1 var(--display); margin: 22px 0 8px; }
.tagline { color: var(--muted); max-width: 34ch; }
.phase { margin: 10px 0 18px; }
.phase .glyph { font-size: 40px; line-height: 1; display: block; margin-bottom: 6px; }
.phase h1 { font: 400 clamp(42px, 12vw, 62px)/1 var(--display); }
.phase .sub { color: var(--muted); margin-top: 8px; }

button { font: inherit; color: inherit; }
.btn { appearance: none; border: 1.5px solid var(--line); background: transparent; border-radius: 12px;
  padding: 11px 16px; min-height: 46px; cursor: pointer; font-weight: 500; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { display: block; width: 100%; }
.btn.quiet { border-color: transparent; color: var(--muted); padding-left: 8px; padding-right: 8px; }
.btn.danger { color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.stack > * + * { margin-top: 10px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 18px 18px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 38%); }
.dock .inner { max-width: 560px; margin: 0 auto; }
.dock .btn { width: 100%; min-height: 54px; font-size: 18px; }

.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.list > li { border-bottom: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 2px; min-height: 52px; }
.list button.item { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 12px 2px; }
.list button.item:hover { background: var(--soft); }
.grow { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.dead { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tally { font-weight: 600; font-variant-numeric: tabular-nums; }
.mini { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.bar { height: 6px; border-radius: 3px; background: var(--accent); margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px;
  min-height: 44px; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.field { display: block; margin: 0 0 14px; }
.field span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=password], select { width: 100%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 11px 14px; font: inherit; }
.vote select { width: auto; max-width: 55%; padding: 8px 10px; border-radius: 10px; }

.card { padding: 22px 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin: 6px 0 14px; }
.card.role .emoji { font-size: 52px; line-height: 1; }
.card.role .rtext b:first-child { font: 400 30px/1.15 var(--display); display: block; margin: 10px 0 6px; }
.reveal { animation: rise .3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.story p { font-size: 19px; line-height: 1.6; }
.story p:first-child { font-family: var(--display); font-size: 23px; line-height: 1.3; }
.notes { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 12px 12px 0; }
.inbox { padding: 14px 16px; border-radius: 14px; background: var(--soft); margin: 6px 0 14px; }
.inbox p:last-child { margin: 0; }
.banner { padding: 12px 14px; border-radius: 12px; background: var(--soft); margin: 12px 0; }
.act b { color: var(--accent); }
.status { font-size: 14px; color: var(--muted); }
.die { width: 112px; height: 112px; margin: 16px auto; border-radius: 22px; background: var(--surface); border: 2px solid var(--line);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14px; }
.die span { width: 19px; height: 19px; border-radius: 50%; place-self: center; }
.die span.on { background: var(--ink); }
.rps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.rps button { font-size: 44px; min-height: 96px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.tools { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 10; max-width: calc(100% - 36px);
  font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
.offline { position: fixed; top: 0; left: 0; right: 0; z-index: 20; text-align: center; font-size: 14px; padding: 6px;
  padding-top: calc(6px + env(safe-area-inset-top, 0px)); background: var(--accent); color: var(--on-accent); }
.tg { min-height: 48px; margin: 6px 0 4px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 22px 0 14px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.narrow { max-width: 560px; margin: 0 auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 18px; }
.cols > * + * { margin-top: 8px; }
.side h2:first-child { margin-top: 26px; }
.temp { font: 600 20px/1.4 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em; }
a { color: inherit; }
@media (min-width: 900px) {
  .wrap { max-width: 1120px; padding: 18px 32px 40px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .cols > * + * { margin-top: 0; }
  .side { border-left: 1px solid var(--line); padding-left: 40px; }
  .dock { position: sticky; left: auto; right: auto; padding: 22px 0 16px; margin-top: 16px; }
  .dock .inner { max-width: none; }
  .phase h1 { font-size: 64px; }
}
</style>
</head>

const lang = () => (ST && ST.me && ST.me.lang) || localGet("mafia-lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en");
function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function t(key, kw) {
  const L = lang();
  let s = (W[L] && W[L][key]) ?? (TX && TX.T[L] && TX.T[L][key]) ?? W.ru[key] ?? (TX && TX.T.ru[key]) ?? key;
  if (Array.isArray(s)) s = s[0];
  if (kw) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in kw ? kw[k] : m));
  return s;

const paras = html => String(html).split(/\n\n+/).map(p => `<p>${nl(p)}</p>`).join("");
function roleName(role, gender, emoji = true) {
  const [m, f] = loc(TX.ROLE_NAMES)[role];
  return (emoji ? TX.ROLE_EMOJI[role] + " " : "") + (gender === "f" ? f : m);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

// ---------- connection ----------
function send(a, o = {}) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ a, ...o }));
  else toast(t("offline"));
}
const host = (c, x, y) => send("h", { c, x, y });

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?token=" + encodeURIComponent(token);
  ws = new WebSocket(url);
  ws.onopen = () => { retry = 0; document.getElementById("offline").hidden = true; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === "state") {
      const prevPhase = ST && ST.room && ST.room.phase;
      ST = m;
      if (ST.room && prevPhase !== ST.room.phase) { UI.view = null; UI.showRole = false; }
      if (!ST.room) UI.view = null;
      if (pendingRoom && !ST.room) { const r = pendingRoom; pendingRoom = null; send("join", { room: r }); }
      else if (pendingRoom && ST.room) pendingRoom = null;
      if (UI.lastDice === null) UI.lastDice = ST.room && ST.room.dice ? ST.room.dice.seq : 0;
      render();
    } else if (m.t === "toast") toast(t(m.key, m.kw));
    else if (m.t === "profile") { PROFILE = m; render(); }
    else if (m.t === "leaders") { UI.leaders = m.rows; render(); }
    else if (m.t === "admin") { UI.admin = m; render(); }
    else if (m.t === "session") {
      token = m.token; localSet("mafia-token", token);
      ws.onclose = null; ws.close(); ST = null; PROFILE = null; UI.page = null;
      toast(t("linked_ok")); connect(); render();
    }
  };
  ws.onclose = e => {
    if (e.code === 4001) { logout(); return; }
    const off = document.getElementById("offline");
    off.textContent = t("offline"); off.hidden = false;
    setTimeout(connect, Math.min(10000, 800 * 2 ** retry++));
  };
}
function logout() {
  token = null; localSet("mafia-token", null); ST = null; PROFILE = null; UI.page = null; UI.code = null;
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  render();
}
async function login(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok || (!d.token && !body.check)) { toast(t(d.error || "login_failed", d.kw || {})); return null; }
    if (body.check) return d;
    token = d.token; localSet("mafia-token", token); UI.code = null;
    app.innerHTML = `<p class="muted" style="padding-top:40px">${t("connecting")}</p>`;
    connect();
    return d;
  } catch (e) { toast(t("login_failed")); return null; }
}

  const r = R.rps;
  if (!r) return "";
  let h = `<h2>✊✋✌️ ${t("rps_title")} <span class="note">${t("rps_round")} ${r.round}</span></h2>`;
  if (r.log.length) h += `<div class="banner small">${r.log.join("<br>")}</div>`;
  if (r.mine) {
    h += `<p>${t("rps_prompt", { v: r.rivals })}</p><div class="rps">${["r", "p", "s"].map(c =>
      `<button data-act="rps" data-x="${c}" aria-label="${c}">${{ r: "✊", p: "✋", s: "✌️" }[c]}</button>`).join("")}</div>`;
  } else if (r.duel.some(d => d.uid === ST.me.uid)) h += `<p class="muted">${t("rps_wait")}</p>`;
  else h += `<p class="muted">${t("rps_watch", { v: r.duel.map(d => esc(d.nick)).join(", ") })}</p>`;
  return h;
}
function decidedBlock(R) {
  if (!R.decided || R.vote_stage !== "decided") return "";
  let h = "";
  if (R.dice) h += dieFace(R.dice.rolls[R.dice.rolls.length - 1]) + `<p class="small muted" style="text-align:center">${R.dice.mapping.join("<br>")}</p>`;
  return h + `<p class="banner">⚖️ ${t("decided", { v: esc(R.decided.nick) })}</p>`;
}

// ---------- host view ----------
function viewHost(R) {
  const H = R.host_view;
  const [glyph, title] = phaseTitle(R);
  const top = topBar(`${t("room")} ${R.id} · ${t("you_host")}`);
  if (UI.view === "roles") return top + `<div class="narrow">${hostRoles(R, H)}</div>`;
  if (UI.view === "settings") return top + `<div class="narrow">${hostSettings(H)}</div>`;
  if (UI.view && UI.view.startsWith("pick:")) {
    const row = (H.night || []).find(r => String(r.actor) === UI.view.slice(5));
    if (row) return top + `<div class="narrow">${hostPick(row)}</div>`;
    UI.view = null;
  }
  let side = "";
  if (H.lineup && R.phase !== "over") side += `<h2>📋 ${t("lineup")}</h2>${lineupList(H.lineup)}`;
  if (H.story_pending && R.story) return top + cols(hostStory(R, H), side + roomTools(R));
  const head = phaseHead(glyph, title);
  if (R.phase === "lobby" || R.phase === "over") return top + cols(head + hostLobby(R, H), side + roomTools(R));
  side += playersList(R) + roomTools(R);
  return top + cols(head + (R.phase === "night" ? hostNight(R, H) : hostDay(R, H)), side);
}
function hostStory(R, H) {
  return `${phaseHead(R.phase === "day" || R.phase === "over" ? "🌅" : "🌆", t("story_title"))}<div class="story">${paras(R.story.html)}</div>
    ${H.notes ? `<div class="notes"><b>🤫 ${t("for_host")}</b><br>${nl(H.notes)}</div>` : ""}
    <div class="stack" style="margin-top:18px">${R.story.public ? `<p class="muted small">✅ ${t("publish_done")}</p>` :
      `<button class="btn block" data-act="h" data-c="publish">📢 ${t("btn_broadcast")}</button>`}</div>
    ${dock("➡️ " + t("btn_next"), "h", "", false).replace('data-act="h"', 'data-act="h" data-c="story_next"')}`;
}
function hostLobby(R, H) {
  let h = "";
  const buttons = `<div class="row" style="margin-top:10px"><button class="btn" data-act="view" data-x="roles">🎭 ${t("btn_roles")}</button>
    <button class="btn" data-act="view" data-x="settings">⚙️ ${t("btn_settings")}</button></div>`;
  if (R.phase === "over") {
    h += `<p class="banner">${R.winner ? loc(TX.TEAM_NAMES)[R.winner] : ""}</p>`;
    if (H.lineup) h += lineupList(H.lineup);
    return h + `<div class="stack" style="margin-top:18px"><button class="btn primary block" data-act="h" data-c="rematch">🔁 ${t("btn_rematch")}</button></div>` + buttons;
  }
  h += playersList(R, { kick: true });
  if (R.players.length) h += `<p class="muted small" style="margin-top:6px">${t("kick_hint")}</p>`;
  h += `<h2>${t("preset")}: ${loc(TX.PRESET_NAMES)[H.prefs.preset]}</h2>`;
  if (H.plan) h += `<p>${H.plan}</p>`;
  if (H.dropped) h += `<p class="muted small">⚠️ ${t("will_drop", { roles: H.dropped })}</p>`;
  return h + buttons + dock("🎲 " + t("btn_deal"), "h_deal", "", R.players.length < 3);
}
function hostRoles(R, H) {
  const p = H.prefs, c = p.counts;
  const presets = ["classic", "extended", "chaos", "custom"].map(k =>
    `<button class="chip" aria-pressed="${p.preset === k}" data-act="h" data-c="preset" data-x="${k}">${loc(TX.PRESET_NAMES)[k]}</button>`).join("");
  const rows = TX.ROLE_ORDER.map(r => {
    const v = c[r] || 0;
    const label = r === "mafia" && !v ? `${t("auto")} (${H.auto_mafia})` : v;
    const team = TX.MAFIA_TEAM.includes(r) ? loc(TX.TEAM_NAMES).mafia : loc(TX.TEAM_NAMES).town;
    return `<li><div class="item"><span class="grow">${roleName(r)}<br><span class="muted small">${team}${r === "bestfriend" ? " · " + t("card_pair") : ""}</span></span>
      <button class="mini" data-act="h" data-c="rc" data-x="${r}" data-y="-" aria-label="−">−</button>
      <span class="tally" style="min-width:52px;text-align:center">${label}</span>
      <button class="mini" data-act="h" data-c="rc" data-x="${r}" data-y="+" aria-label="+">+</button></div>
      <p class="muted small" style="margin:-4px 0 10px">${loc(TX.ROLE_DESC)[r]}</p>
      ${r === "mafia" && v ? `<p style="margin:-6px 0 8px"><button class="btn quiet small" data-act="h" data-c="rc" data-x="mafia" data-y="auto">↺ ${t("mafia_auto")}</button></p>` : ""}</li>`;
  }).join("");
  return `<div class="top"><button class="btn quiet" data-act="view" data-x="">‹ ${t("back")}</button></div>
    <h2 style="margin-top:4px">${t("roles_title")}</h2><div class="chips">${presets}</div>
    <p class="muted small" style="margin-top:14px">${t("roles_hint")}</p><ul class="list">${rows}</ul>`;
}
function hostSettings(H) {
  const p = H.prefs;
  const val = (k, v) => (typeof v === "boolean" ? (v ? "✅" : "❌") : t(`val_${k}_${v}`));
  const rows = Object.keys(TX.SETTINGS).map(k => `<li><div class="item"><span class="grow">${t("set_" + k)}</span>
    <button class="chip" data-act="h" data-c="st" data-x="${k}">${val(k, p[k])}</button></div></li>`).join("");
  return `<div class="top"><button class="btn quiet" data-act="view" data-x="">‹ ${t("back")}</button></div>
    <h2 style="margin-top:4px">${t("settings_title")}</h2><p class="muted small">${t("settings_hint")}</p><ul class="list">${rows}</ul>`;
}
function lineupList(lineup) {
  return `<ul class="list">${lineup.map(p => `<li><div class="item"><span class="grow"><span class="${p.alive ? "" : "dead"}">${p.name}</span><br>
    <span class="muted small">${p.role}</span></span><span class="tally">${p.pts}</span></div></li>`).join("")}</ul>`;
}


function hostNight(R, H) {
  const rows = H.night.map(r => `<li><button class="item act" data-act="view" data-x="pick:${r.actor}">
    <span class="grow">${nl(r.html)}</span><span aria-hidden="true">${r.done ? "✓" : "›"}</span></button></li>`).join("");
  return `${R.night_input === "phones" ? `<p class="muted small">${t("phones_hint")}</p>` : ""}
    <ul class="list">${rows}</ul><p class="muted small" style="margin-top:10px">${t("night_hint")}</p>
    ${inboxBlock(R)}${dock("🌅 " + t("btn_end_night"), "h_endnight")}`;
}
function hostPick(row) {
  const chips = row.cands.map(c => `<button class="chip" aria-pressed="${row.chosen.includes(c.uid)}" data-act="h" data-c="nt" data-x="${row.actor}" data-y="${c.uid}">${esc(c.nick)}</button>`).join("");
  return `<div class="top"><button class="btn quiet" data-act="view" data-x="">‹ ${t("back")}</button></div>
    <h2 style="margin-top:4px;font-size:22px">${row.title}</h2><div class="chips">${chips}</div>
    <p style="margin-top:16px"><button class="btn" data-act="h" data-c="nt" data-x="${row.actor}" data-y="0">🚫 ${t("skip")}</button></p>`;
}
function exileButtons(R, H, cand, nick) {
  let b = `<button class="btn primary block" data-act="h" data-c="ex" data-x="${cand}">⚖️ ${t("btn_exile", { v: esc(nick) })}</button>`;
  if (H.mayor) b += `<button class="btn block" data-act="h" data-c="mayor" data-x="${cand}">🎩 ${t("btn_mayor")}</button>`;
  b += `<button class="btn block" data-act="h" data-c="ex" data-x="0">🤝 ${t("btn_no_exile")}</button>`;
  return `<div class="stack" style="margin-top:14px">${b}</div>`;
}
function tallyList(H) {
  const max = Math.max(1, ...H.tally.map(x => x.n));
  return H.tally.length ? `<ul class="list">${H.tally.map(x => `<li><div class="item"><span class="grow">${esc(x.nick)}<div class="bar" style="width:${(x.n / max) * 100}%"></div></span><span class="tally">${x.n}</span></div></li>`).join("")}</ul>` : `<p class="muted">${t("no_votes")}</p>`;
}
function hostDay(R, H) {
  const st = R.vote_stage, alive = R.players.filter(p => p.alive);
  const tail = "";
  if (R.round === 0) return `<p class="muted">${t("intro_hint")}</p>${tail}${dock("🌙 " + t("btn_start_night"), "h_nightstart")}`;
  if (st === null) return `${inboxBlock(R)}<p class="muted">${t("alive")}: ${alive.length}</p>${tail}${dock("🗳 " + t("btn_open_vote"), "h_vopen")}`;
  if (st === "open") {
    const nickOf = id => (R.players.find(p => p.uid === id) || {}).nick;
    let rows;
    if (R.vote_mode === "host") {
      rows = alive.map(v => `<li><div class="item vote"><span class="grow">${esc(v.nick)}</span>
        <select aria-label="${esc(v.nick)}" data-act-change="vt" data-x="${v.uid}"><option value="0">—</option>${alive.filter(x => x.uid !== v.uid).map(x =>
          `<option value="${x.uid}" ${H.votes[v.uid] === x.uid ? "selected" : ""}>${esc(x.nick)}</option>`).join("")}</select></div></li>`).join("");
    } else {
      rows = alive.map(v => { const c = H.votes[v.uid]; return `<li><div class="item"><span class="grow">${c ? "✅" : "⏳"} ${esc(v.nick)}${c ? ` <span class="muted">→ ${esc(nickOf(c))}</span>` : ""}</span>
        ${c ? `<button class="mini" title="${t("btn_cancel_votes")}" aria-label="${t("btn_cancel_votes")}" data-act="h" data-c="vt" data-x="${v.uid}" data-y="0">↩️</button>` : ""}</div></li>`; }).join("");
    }
    return `<h2>${t("vote_title")}</h2><p class="muted small">${t(R.vote_mode === "host" ? "vote_hint_host" : "vote_hint_phones")}</p>
      <ul class="list">${rows}</ul><h2>${t("vote_result")}</h2>${tallyList(H)}${tail}${dock("🔒 " + t("btn_close_vote"), "h_vclose")}`;
  }
  if (st === "result") {
    let h = `<h2>${t("vote_result")}</h2>${tallyList(H)}`;
    const lead = H.leaders;
    const nick = id => (H.tally.find(x => x.uid === id) || {}).nick;
    if (lead.length === 1) h += `<p style="margin-top:14px">${t("leader", { v: esc(nick(lead[0])) })}</p>${exileButtons(R, H, lead[0], nick(lead[0]))}`;
    else if (lead.length > 1) {
      h += `<p style="margin-top:14px">${t("tie", { v: lead.map(x => esc(nick(x))).join(", ") })}</p><p class="muted">${t("tie_choose")}</p>`;
      const star = H.tie_default;
      const opts = [["nobody", "🤝", "ex", "0"], ["rps", "✊", "rps", ""], ["random", "🎲", "dice", ""], ["revote", "🔁", "revote", ""]];
      opts.sort((a, b) => (a[0] !== star) - (b[0] !== star));
      h += `<div class="stack">${opts.map(([k, e, c, x]) => `<button class="btn block ${k === star ? "primary" : ""}" data-act="h" data-c="${c}" data-x="${x}">${k === star ? "⭐ " : ""}${e} ${t("tie_" + k)}</button>`).join("")}</div>`;
    } else h += `<div class="stack" style="margin-top:14px"><button class="btn block" data-act="h" data-c="ex" data-x="0">🤝 ${t("btn_no_exile")}</button>
      <button class="btn block" data-act="h" data-c="revote">🔁 ${t("tie_revote")}</button></div>`;
    return h + tail;
  }
  if (st === "rps" && R.rps) {
    const r = R.rps;
    return `<h2>✊✋✌️ ${t("rps_title")} <span class="note">${t("rps_round")} ${r.round}</span></h2>
      ${r.log.length ? `<div class="banner small">${r.log.join("<br>")}</div>` : ""}
      <ul class="list">${r.duel.map(d => `<li><div class="item"><span class="grow">${esc(d.nick)}</span><span>${d.done ? "✅" : "⏳"}</span></div></li>`).join("")}</ul>
      <div class="stack" style="margin-top:14px"><button class="btn block" data-act="h" data-c="rpsrand">🎲 ${t("btn_rps_random")}</button>
      <button class="btn block" data-act="h" data-c="rpsx">✖️ ${t("btn_rps_cancel")}</button></div>${tail}`;
  }
  if (st === "decided" && R.decided) {
    return `${decidedBlock(R)}${exileButtons(R, H, R.decided.uid, R.decided.nick)}${tail}`;
  }
  return tail;
}

// ---------- render ----------
function typing() { const a = document.activeElement; return a && a.tagName === "INPUT" && ["text", "password"].includes(a.type) && app.contains(a); }
let deferred = false;
function render() {
  if (!TX) return;
  if (typing() && ST) { deferred = true; return; }
  deferred = false;
  const R = ST && ST.room;
  document.documentElement.lang = lang();
  document.body.dataset.theme = R && R.phase === "night" && !(R.host_view && R.host_view.story_pending) ? "night" : "day";
  let html;
  if (!token) html = viewLogin();
  else if (!ST) html = `<p class="muted" style="padding-top:40px">${t("connecting")}</p>`;
  else if (UI.page === "profile") html = viewProfile();
  else if (UI.page === "leaders") html = viewLeaders();
  else if (UI.page === "admin" && ST.me.owner) html = viewAdmin();
  else if (!R) html = viewRooms();
  else html = R.am_host ? viewHost(R) : viewPlayer(R);
  // keep what the person has typed when the screen redraws (e.g. after tapping ♂/♀)
  const typed = {};
  app.querySelectorAll("input[id]").forEach(i => { if (i.value) typed[i.id] = i.value; });
  app.innerHTML = html;
  for (const [id, v] of Object.entries(typed)) { const el = document.getElementById(id); if (el && !el.value) el.value = v; }
  animateDice();
}
document.addEventListener("focusout", () => setTimeout(() => { if (deferred) render(); }, 0));

function animateDice() {
  const R = ST && ST.room;
  if (!R || !R.dice || R.dice.seq === UI.lastDice) return;
  UI.lastDice = R.dice.seq;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const rolls = R.dice.rolls;
  let i = 0, k = 0;
  const step = () => {
    const el = document.getElementById("die");
    if (!el) return;
    if (k < 8) { el.outerHTML = dieFace(1 + Math.floor(Math.random() * 6)); k++; setTimeout(step, 80); return; }
    el.outerHTML = dieFace(rolls[i]);
    if (++i < rolls.length) { k = 0; setTimeout(step, 600); }
  };
  step();
}

// ---------- events ----------
const val = id => (document.getElementById(id) || {}).value || "";
const q = sel => document.querySelector(sel) || {};

const ACT = {
  auth(x) { UI.auth = x; UI.code = null; render(); },
  guestGender(x) { UI.guestGender = UI.guestGender === x ? null : x; render(); },
  guest() { login("/api/guest", { nick: val("fNick"), gender: UI.guestGender, lang: lang() }); },
  doLogin() { login("/api/login", { login: val("fLogin").trim(), password: val("fPw") }); },
  doRegister() { login("/api/register", { login: val("fLogin").trim(), password: val("fPw"), nick: val("fNick") || val("fLogin"), gender: UI.guestGender, lang: lang() }); },
  async codeCheck() {
    const code = val("fCode").replace(/\D/g, "");
    const d = await login("/api/code", { code, check: true });
    if (d) { UI.code = { code, nick: d.nick, login: d.login }; render(); }
  },
  codeFinish() { login("/api/code", { code: UI.code.code, login: val("fLogin").trim(), password: val("fPw") }); },
  page(x) {
    UI.page = x || null;
    if (x === "profile") { PROFILE = null; send("profile"); }
    if (x === "leaders") { UI.leaders = null; send("leaders"); }
    if (x === "admin") { UI.admin = null; send("admin_list", { q: "" }); }
    render(); window.scrollTo(0, 0);
  },
  saveAccount() { send("create_account", { login: val("aLogin").trim(), password: val("aPw") }); },
  changePw() { send("change_password", { old: val("pOld"), password: val("pNew") }); q("#pOld").value = ""; q("#pNew").value = ""; },
  linkTg() { send("link_tg", { code: val("lCode").replace(/\D/g, "") }); },
  adminSearch() { send("admin_list", { q: val("aQ") }); },
  adminReset(x) { send("admin_reset", { uid: +x, q: val("aQ") }); },
  saveNick() { const v = document.getElementById("profNick").value; document.getElementById("profNick").blur(); send("set_profile", { nick: v }); },
  setGender(x) { send("set_profile", { gender: x || null }); },
  setLang(x) { localSet("mafia-lang", x); send("set_profile", { lang: x }); },
  logout,
  create() { send("create"); },
  join(x) { send("join", { room: +x }); },
  leave() { send("leave"); },
  play() { send("play"); }, watch() { send("watch"); },
  take_host() { send("take_host"); }, owner_host() { send("owner_host"); },
  abort() { if (confirm(t("end_confirm"))) { if (ST.room.am_host) host("abort"); else send("abort"); } },
  invite() {
    const url = `${location.origin}${location.pathname}?room=${ST.room.id}`;
    if (navigator.share) navigator.share({ title: `${t("title")} · ${t("room")} ${ST.room.id}`, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast(t("copied")), () => toast(url));
    else toast(url);
  },
  toggleRole() { UI.showRole = !UI.showRole; render(); },
  night(x) { send("night", { target: +x }); },
  vote(x) { send("vote", { target: +x }); },
  unvote() { send("unvote"); },
  rps(x) { send("rps", { c: x }); },
  view(x) { UI.view = x || null; render(); window.scrollTo(0, 0); },
  kick(x) { host("kick", +x); },
  h(x, el) {
    const c = el.dataset.c, y = el.dataset.y;
    if (c === "nt") {
      host("nt", x, +y);
      const row = (ST.room.host_view.night || []).find(r => String(r.actor) === String(x));
      if (!(row && row.multi && +y && row.chosen.length === 0)) UI.view = null;
      return;
    }
    host(c, x === "" ? undefined : (isNaN(+x) ? x : +x), y);
  },
  h_deal() { host("deal"); }, h_endnight() { host("endnight"); }, h_nightstart() { host("nightstart"); },
  h_vopen() { host("vopen"); }, h_vclose() { host("vclose"); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.tagName === "SELECT") return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.x ?? "", el); }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act-change]");
  if (el && el.dataset.actChange === "vt") host("vt", +el.dataset.x, +el.value);
  if (el && el.dataset.actChange === "lang") { localSet("mafia-lang", el.value); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const enter = { fLogin: null, fPw: null, fNick: null, fCode: "codeCheck", profNick: "saveNick", lCode: "linkTg", aQ: "adminSearch", pNew: "changePw", aPw: "saveAccount" };
  if (!(e.target.id in enter)) return;
  e.preventDefault();
  let act = enter[e.target.id];
  if (act === null) act = { login: "doLogin", register: "doRegister", guest: "guest", code: UI.code ? "codeFinish" : "codeCheck" }[UI.auth];
  ACT[act]();
});

// ---------- start ----------
(async () => {
  try {
    [TX, CONF] = await Promise.all([fetch("/api/texts").then(r => r.json()), fetch("/api/config").then(r => r.json())]);
  } catch (e) { app.innerHTML = `<p style="padding-top:40px">${W[lang()].offline}</p>`; setTimeout(() => location.reload(), 4000); return; }
  render();
  if (token) connect();
})();
</script>
</body>
